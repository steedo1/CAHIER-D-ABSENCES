[package]
name = "mon-cahier-finance-desktop"
version = "0.1.0"
edition = "2021"
description = "Prototype local et autonome de Mon Cahier Finance"

[lib]
name = "mon_cahier_finance_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
