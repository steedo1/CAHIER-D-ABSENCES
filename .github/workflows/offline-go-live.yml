name: Offline Go-Live Gate

on:
  push:
    branches:
      - work/offline-go-live-20260821
      - reprise-propre-5418ce7-20260729
      - main
  pull_request:
    branches:
      - reprise-propre-5418ce7-20260729
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: offline-go-live-${{ github.ref }}
  cancel-in-progress: true

jobs:
  autofix-reachable-endpoint:
    name: Apply reachable relay endpoint fix
    if: (github.event_name == 'push' && github.ref_name == 'reprise-propre-5418ce7-20260729') || (github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/relay-working-endpoint-20260824')
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          ref: fix/relay-working-endpoint-20260824
          fetch-depth: 0

      - name: Apply exact TeacherDashboard patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/components/teacher/TeacherDashboard.tsx")
          text = path.read_text(encoding="utf-8")

          old_memo = '''  const relayBaseUrl = useMemo(() => preferredRelayBaseUrl({
            institutionId: inst.institution_id,
            baseUrl: inst.attendance_presence?.relay_local_url,
            baseUrls: inst.attendance_presence?.relay_local_urls,
          }), [
            inst.institution_id,
            inst.attendance_presence?.relay_local_url,
            inst.attendance_presence?.relay_local_urls,
          ]);'''
          new_live = '''  // Recalcule à chaque rendu : après une sonde réussie, preferredRelayBaseUrl
          // relit automatiquement l'adresse LAN mémorisée sans rechargement manuel.
          const relayBaseUrl = preferredRelayBaseUrl({
            institutionId: inst.institution_id,
            baseUrl: inst.attendance_presence?.relay_local_url,
            baseUrls: inst.attendance_presence?.relay_local_urls,
          });'''
          if old_memo in text:
              text = text.replace(old_memo, new_live, 1)
          elif new_live not in text:
              raise SystemExit("relayBaseUrl pattern missing")

          old_signature = '''  async function preparePresenceEvidence(
    clientSessionId: string,
    forceGps = false,
  ): Promise<{'''
          new_signature = '''  async function preparePresenceEvidence(
    clientSessionId: string,
    forceGps = false,
    relayBaseUrlOverride?: string | null,
  ): Promise<{'''
          if old_signature in text:
              text = text.replace(old_signature, new_signature, 1)
          elif new_signature not in text:
              raise SystemExit("preparePresenceEvidence signature missing")

          old_presence_url = '''          baseUrl: relayBaseUrl,
          accessToken: policy.relay_access_token,'''
          new_presence_url = '''          baseUrl: relayBaseUrlOverride || relayBaseUrl,
          accessToken: policy.relay_access_token,'''
          if old_presence_url in text:
              text = text.replace(old_presence_url, new_presence_url, 1)
          elif new_presence_url not in text:
              raise SystemExit("presence relay URL pattern missing")

          old_cloud = '''      const cloudAvailable = await teacherSessionCloudAvailable();'''
          new_cloud = '''      // Réutilise immédiatement l'adresse que la sonde vient de confirmer.
      const activeRelayBaseUrl = liveRelayCheck?.base_url || relayBaseUrl;
      const cloudAvailable = await teacherSessionCloudAvailable();'''
          if old_cloud in text:
              text = text.replace(old_cloud, new_cloud, 1)
          elif new_cloud not in text:
              raise SystemExit("cloud availability anchor missing")

          old_open = '''          relayBaseUrl,
          relayAccessToken: inst.attendance_presence?.relay_access_token,'''
          new_open = '''          relayBaseUrl: activeRelayBaseUrl,
          relayAccessToken: inst.attendance_presence?.relay_access_token,'''
          if old_open in text:
              text = text.replace(old_open, new_open, 1)
          elif new_open not in text:
              raise SystemExit("session open relay URL pattern missing")

          old_presence_call = '''      const presence = await preparePresenceEvidence(
        clientSessionId,
        startDecision.force_gps,
      );'''
          new_presence_call = '''      const presence = await preparePresenceEvidence(
        clientSessionId,
        startDecision.force_gps,
        activeRelayBaseUrl,
      );'''
          if old_presence_call in text:
              text = text.replace(old_presence_call, new_presence_call, 1)
          elif new_presence_call not in text:
              raise SystemExit("presence call pattern missing")

          path.write_text(text, encoding="utf-8")

          test = Path("test/teacher-relay-working-endpoint-wiring.test.mjs")
          test.write_text('''import assert from "node:assert/strict";\nimport fs from "node:fs";\nimport test from "node:test";\n\nconst source = fs.readFileSync(\n  new URL("../src/components/teacher/TeacherDashboard.tsx", import.meta.url),\n  "utf8",\n);\n\ntest("relay URL is recomputed after a successful fallback probe", () => {\n  assert.match(source, /const relayBaseUrl = preferredRelayBaseUrl\\(\\{/);\n  assert.doesNotMatch(source, /const relayBaseUrl = useMemo\\(\\(\\) => preferredRelayBaseUrl/);\n});\n\ntest("the live reachable endpoint is reused immediately for offline session opening", () => {\n  assert.match(source, /const activeRelayBaseUrl = liveRelayCheck\\?\\.base_url \\|\\| relayBaseUrl;/);\n  assert.match(source, /openTeacherAttendanceSessionOnRelay\\(\\{[\\s\\S]*?relayBaseUrl: activeRelayBaseUrl,/);\n});\n\ntest("the same reachable endpoint is used for local presence proof", () => {\n  assert.match(source, /relayBaseUrlOverride\\?: string \\| null/);\n  assert.match(source, /baseUrl: relayBaseUrlOverride \\|\\| relayBaseUrl/);\n  assert.match(source, /preparePresenceEvidence\\([\\s\\S]*?activeRelayBaseUrl,[\\s\\S]*?\\);/);\n});\n''', encoding="utf-8")

          for temp in [
              Path(".github/workflows/relay-working-endpoint-hotfix.yml"),
              Path(".github/relay-working-endpoint-trigger.txt"),
          ]:
              if temp.exists():
                  temp.unlink()

      - name: Focused regression test
        run: node --test test/teacher-relay-working-endpoint-wiring.test.mjs

      - name: Commit exact fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No changes required"
            exit 0
          fi
          git commit -m "fix(relay): reuse the reachable teacher endpoint"
          git push origin HEAD:fix/relay-working-endpoint-20260824

  web-offline-critical:
    name: Web offline critical
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Typecheck web
        run: npx tsc --noEmit

      - name: Critical offline regression suite
        run: |
          node --test \
            test/pwa-stability.test.mjs \
            test/phone-offline-login-stability.test.mjs \
            test/offline-auth-contract.test.mjs \
            test/offline-auth-logout-wiring.test.mjs \
            test/offline-schedule-wiring.test.mjs \
            test/teacher-minimal-preparation.test.mjs \
            test/class-device-minimal-preparation.test.mjs \
            test/class-device-offline-lifecycle-wiring.test.mjs \
            test/class-device-offline-logout-pwa.test.mjs \
            test/class-device-relay-cloud-local-fallback.test.mjs \
            test/admin-background-preparation-isolation.test.mjs \
            test/admin-essential-offline-data.test.mjs \
            test/admin-essential-request-timeout.test.mjs \
            test/admin-offline-essential-navigation.test.mjs \
            test/attendance-integrity-wiring.test.mjs \
            test/relay-supervision-ui.test.mjs \
            test/cloud-only-grade-writes.test.mjs

  web-production-dependencies:
    name: Web production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install web dependencies
        run: npm ci

      - name: Inventory vulnerable direct package usage
        shell: bash
        run: |
          echo '=== XLSX CODE USAGE ==='
          git grep -n -E "(from|require\().*['\"]xlsx['\"]|XLSX\." -- . ':!package-lock.json' ':!package.json' || true
          echo '=== JSPDF CODE USAGE ==='
          git grep -n -E "(from|require\().*['\"]jspdf['\"]|jsPDF" -- . ':!package-lock.json' ':!package.json' || true
          echo '=== DEPENDENCY PATHS ==='
          npm ls xlsx jspdf axios @xmldom/xmldom form-data nanoid next postcss sharp ws || true

      - name: Reject high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  relay-production-dependencies:
    name: Relay production dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/relay/package-lock.json

      - name: Install relay dependencies
        working-directory: desktop/relay
        run: npm ci

      - name: Reject high or critical relay dependency vulnerabilities
        working-directory: desktop/relay
        run: npm audit --omit=dev --audit-level=high

  relay-full-verify:
    name: Relay full verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require canonical academic revision migration
        shell: bash
        run: |
          test -f migrations/20260813_relay_academic_revision_v1.sql || {
            echo '::error file=migrations/20260813_relay_academic_revision_v1.sql::Migration academique historique absente de Git. Le go-live reste bloque tant que la migration appliquee au Cloud n est pas recuperee et versionnee.'
            exit 1
          }

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/relay/package-lock.json

      - name: Install relay dependencies
        working-directory: desktop/relay
        run: npm ci

      - name: Full relay verification without exclusions
        working-directory: desktop/relay
        run: npm run verify

  release-contract:
    name: Release contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify critical release files
        shell: bash
        run: |
          set -euo pipefail
          test -f public/moncahier-sw.js
          test -f src/lib/offline-release.ts
          test -f src/lib/offline-auth-contract.ts
          test -f src/lib/offline-auth-readiness.ts
          test -f src/lib/offline-readiness.ts
          test -f desktop/relay/windows/Installer-Mon-Cahier.cmd
          test -f desktop/relay/windows/install-relay.ps1
          test -f desktop/relay/windows/install-startup-task.ps1
          test -f desktop/relay/migrations/0009_academic_provisioning.sql
          grep -q 'MON_CAHIER_OFFLINE_SCHEMA_VERSION' src/lib/offline-release.ts
          grep -q 'schema_version -lt 9' desktop/relay/windows/install-relay.ps1
          grep -q 'bootstrap_revision_ack_v1' desktop/relay/windows/install-relay.ps1
