name: Fix roster notes block at end

on:
  push:
    branches:
      - fix/roster-notes-block-at-end

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/roster-notes-block-at-end
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Move notes block to far right
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('src/app/admin/classes/liste/[id]/page.tsx')
          text = path.read_text(encoding='utf-8')

          header_pattern = re.compile(
              r'(?P<i>[ \t]*)<th className="col-name">Nom et prénoms</th>\s*'
              r'<th className="col-series">Note1</th>\s*'
              r'<th className="col-board">Note2</th>\s*'
              r'<th className="col-lv2">Note3</th>\s*'
              r'<th className="col-nat">Note4</th>\s*'
              r'<th className="col-affect">Aff\.</th>\s*'
              r'<th className="col-date">Né\(e\) le</th>\s*'
              r'<th className="col-sex">Sexe</th>\s*'
              r'<th className="col-red">Red</th>'
          )

          def header_repl(match):
              i = match.group('i')
              return '\n'.join([
                  f'{i}<th className="col-name">Nom et prénoms</th>',
                  f'{i}<th className="col-affect">Aff.</th>',
                  f'{i}<th className="col-date">Né(e) le</th>',
                  f'{i}<th className="col-sex">Sexe</th>',
                  f'{i}<th className="col-red">Red</th>',
                  f'{i}<th className="col-series">Note1</th>',
                  f'{i}<th className="col-board">Note2</th>',
                  f'{i}<th className="col-lv2">Note3</th>',
                  f'{i}<th className="col-nat">Note4</th>',
              ])

          text, header_count = header_pattern.subn(header_repl, text, count=1)
          if header_count != 1:
              raise SystemExit(f'expected one roster header block, found {header_count}')

          body_pattern = re.compile(
              r'(?P<i>[ \t]*)<td className="col-name">\s*'
              r'\{formatTraditionalStudentName\(student\)\}\s*'</n              r'</td>\s*'
              r'<td className="col-series"></td>\s*'
              r'<td className="col-board"></td>\s*'
              r'<td className="col-lv2"></td>\s*'
              r'<td className="col-nat"></td>\s*'
              r'<td className="col-affect">\s*'
              r'\{affectationShort\(student\.is_affecte\)\}\s*'
              r'</td>\s*'
              r'<td className="col-date">\s*'
              r'\{formatDateFR\(student\.birthdate\)\}\s*'
              r'</td>\s*'
              r'<td className="col-sex">\{sexShort\(student\.gender\)\}</td>\s*'
              r'<td className="col-red">\s*'
              r'\{student\.is_repeater \? "R" : ""\}\s*'
              r'</td>'
          )

          def body_repl(match):
              i = match.group('i')
              c = i + '  '
              return '\n'.join([
                  f'{i}<td className="col-name">',
                  f'{c}{{formatTraditionalStudentName(student)}}',
                  f'{i}</td>',
                  f'{i}<td className="col-affect">',
                  f'{c}{{affectationShort(student.is_affecte)}}',
                  f'{i}</td>',
                  f'{i}<td className="col-date">',
                  f'{c}{{formatDateFR(student.birthdate)}}',
                  f'{i}</td>',
                  f'{i}<td className="col-sex">{{sexShort(student.gender)}}</td>',
                  f'{i}<td className="col-red">',
                  f'{c}{{student.is_repeater ? "R" : ""}}',
                  f'{i}</td>',
                  f'{i}<td className="col-series"></td>',
                  f'{i}<td className="col-board"></td>',
                  f'{i}<td className="col-lv2"></td>',
                  f'{i}<td className="col-nat"></td>',
              ])

          text, body_count = body_pattern.subn(body_repl, text, count=1)
          if body_count != 1:
              raise SystemExit(f'expected one roster body block, found {body_count}')

          path.write_text(text, encoding='utf-8')
          PY

      - name: Run focused regression test
        run: node --test test/timetable-roster-ux.test.mjs

      - name: Validate diff
        run: git diff --check

      - name: Commit final fix
        shell: bash
        run: |
          rm -f .github/workflows/fix-roster-notes-end.yml
          rm -f .github/fix-roster-notes-end.trigger
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "fix(roster): placer le bloc notes en fin de tableau"
          git push origin HEAD:fix/roster-notes-block-at-end
