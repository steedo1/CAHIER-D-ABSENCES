name: Certification Next Patch 15.5.23

on:
  push:
    branches:
      - work/offline-go-live-20260821
    paths:
      - .github/workflows/cert-next-patch-probe.yml

permissions:
  contents: write

concurrency:
  group: cert-next-patch-15-5-23
  cancel-in-progress: true

jobs:
  verify-and-commit-next-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout certification branch
        uses: actions/checkout@v4
        with:
          ref: work/offline-go-live-20260821
          fetch-depth: 0

      - name: Confirm exact branch head
        run: git pull --ff-only origin work/offline-go-live-20260821

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install exact current tree
        run: npm ci

      - name: Snapshot package contract
        shell: bash
        run: |
          cp package.json /tmp/package-before.json
          node -p "'Current Next: ' + require('./node_modules/next/package.json').version"
          node -p "'Current React: ' + require('./node_modules/react/package.json').version"
          node -p "'Current React DOM: ' + require('./node_modules/react-dom/package.json').version"

      - name: Apply only Next 15.5.23 patch
        run: npm install next@15.5.23 --save-prefix='^'

      - name: Enforce isolated dependency contract
        shell: bash
        run: |
          set -euo pipefail
          unexpected="$(git diff --name-only | grep -Ev '^(package.json|package-lock.json)$' || true)"
          if [ -n "$unexpected" ]; then
            echo "$unexpected"
            echo '::error::Next patch changed files outside package.json/package-lock.json.'
            exit 1
          fi
          node <<'NODE'
          const fs = require('fs');
          const before = JSON.parse(fs.readFileSync('/tmp/package-before.json', 'utf8'));
          const after = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const expected = JSON.parse(JSON.stringify(before));
          expected.dependencies.next = after.dependencies.next;
          if (JSON.stringify(expected) !== JSON.stringify(after)) {
            throw new Error('package.json changed beyond the Next dependency');
          }
          if (after.dependencies.next !== '^15.5.23') {
            throw new Error('Unexpected package.json Next range: ' + after.dependencies.next);
          }
          const installed = require('./node_modules/next/package.json').version;
          if (installed !== '15.5.23') throw new Error('Unexpected installed Next version: ' + installed);
          NODE
          git diff -- package.json package-lock.json

      - name: Typecheck web
        run: npx tsc --noEmit

      - name: Critical offline regression suite
        run: |
          node --test \
            test/pwa-stability.test.mjs \
            test/phone-offline-login-stability.test.mjs \
            test/offline-auth-contract.test.mjs \
            test/offline-auth-logout-wiring.test.mjs \
            test/offline-schedule-wiring.test.mjs \
            test/teacher-minimal-preparation.test.mjs \
            test/class-device-minimal-preparation.test.mjs \
            test/class-device-offline-lifecycle-wiring.test.mjs \
            test/class-device-offline-logout-pwa.test.mjs \
            test/class-device-relay-cloud-local-fallback.test.mjs \
            test/admin-background-preparation-isolation.test.mjs \
            test/admin-essential-offline-data.test.mjs \
            test/admin-essential-request-timeout.test.mjs \
            test/admin-offline-essential-navigation.test.mjs \
            test/attendance-integrity-wiring.test.mjs \
            test/relay-supervision-ui.test.mjs \
            test/cloud-only-grade-writes.test.mjs

      - name: Report production dependency audit
        shell: bash
        run: npm audit --omit=dev || true

      - name: Refuse stale write and commit verified patch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin work/offline-go-live-20260821
          remote_head="$(git rev-parse origin/work/offline-go-live-20260821)"
          if [ "$remote_head" != "$GITHUB_SHA" ]; then
            echo "::error::Certification branch moved from $GITHUB_SHA to $remote_head. Refusing stale write."
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package.json package-lock.json
          git commit -m 'chore(security): mettre Next a jour vers 15.5.23'
          git push origin HEAD:work/offline-go-live-20260821
