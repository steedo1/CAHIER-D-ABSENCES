name: LOT4 Relay Verify

on:
  push:
    branches:
      - lot4-grade-versioning-20260815
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: desktop/relay/package-lock.json

      - name: Install relay dependencies
        working-directory: desktop/relay
        run: npm ci

      - name: Typecheck relay
        working-directory: desktop/relay
        run: npm run typecheck

      - name: Build relay
        working-directory: desktop/relay
        run: npm run build

      - name: Test relay except two historical local-only checks
        working-directory: desktop/relay
        shell: bash
        run: |
          # Ces deux validations historiques lisent volontairement
          # ../../migrations/20260813_relay_academic_revision_v1.sql.
          # Ce fichier est conservé localement et n'est pas versionné dans GitHub.
          # On exécute donc tout le reste de la suite, y compris les tests LOT4.
          mapfile -t tests < <(
            find dist/test -maxdepth 1 -name '*.test.mjs' \
              ! -name 'academic-revision-concurrency.test.mjs' \
              -print | sort
          )
          node --test \
            --test-name-pattern='^(?!preuve statique: revision academique exhaustive, distincte du planning et hors Finance$).*' \
            "${tests[@]}"
