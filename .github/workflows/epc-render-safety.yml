name: EPC student safety Render
on:
  pull_request:
    branches: [migration-render-test-20261021]
  push:
    branches: [migration-render-test-20261021]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: node --test test/epc-render-student-safety.test.mjs test/epc-arabic-direct-identity.test.mjs
      - run: node --import tsx --test test/arabic-name-edit-api.test.mjs test/arabic-name-edit-ui.test.mjs test/arabic-class-list-labels.test.ts
