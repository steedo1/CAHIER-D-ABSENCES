name: Fix manual subject selector

on:
  push:
    branches:
      - fix/manual-subject-selector-20260915

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/manual-subject-selector-20260915
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Apply targeted fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/app/class/page.tsx')
          s = p.read_text()
          old = '''        applyList(\n          legacyList,\n          legacyList.length\n            ? isOnline\n              ? "legacy-fallback"\n              : "legacy-offline"\n            : "empty",\n        );\n        setSubjectId("");\n        return;'''
          new = '''        applyList(\n          legacyList,\n          legacyList.length\n            ? isOnline\n              ? "legacy-fallback"\n              : "legacy-offline"\n            : "empty",\n        );\n        return;'''
          if s.count(old) != 1:
              raise SystemExit(f'expected exact block once, found {s.count(old)}')
          p.write_text(s.replace(old, new))
          PY
      - name: Install dependencies
        run: npm ci
      - name: TypeScript
        run: npx tsc --noEmit
      - name: Diff check
        run: git diff --check
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/app/class/page.tsx
          git commit -m "fix: keep manual subject selector populated"
          git push
