name: Paginate import identity safety

on: [push]

permissions:
  contents: write

jobs:
  patch:
    if: github.ref == 'refs/heads/fix/import-identity-safety-20260827'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply pagination patch
        run: python scripts/one-shot-paginate-import-identities.py
      - name: Verify focused tests
        run: node --test test/student-year-transition-and-import-policy.test.mjs
      - name: Check diff
        run: git diff --check
      - name: Commit patch
        run: |
          rm .github/workflows/paginate-import-identity-safety.yml
          rm scripts/one-shot-paginate-import-identities.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(import): paginer le contrôle global des identités"
          git push origin HEAD:fix/import-identity-safety-20260827
