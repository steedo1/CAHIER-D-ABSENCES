name: Apply timetable roster UX

on:
  push:
    branches:
      - feat/timetable-conflict-visibility-and-roster-notes

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/timetable-conflict-visibility-and-roster-notes
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply source changes
        run: python3 scripts/apply-timetable-roster-ux.py

      - name: Scope roster assertions to the printable table
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('test/timetable-roster-ux.test.mjs')
          s = p.read_text(encoding='utf-8')
          old = '  const roster = read("src/app/admin/classes/liste/[id]/page.tsx");'
          new = '  const roster = (read("src/app/admin/classes/liste/[id]/page.tsx").split(\'<table className="roster-table">\')[1] || "").split("</table>")[0];'
          if old not in s:
              raise SystemExit('roster assertion anchor missing')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Run focused regression test
        run: node --test test/timetable-roster-ux.test.mjs

      - name: Commit feature changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat(timetables): show occupancy and warn on conflicts"
          git push origin HEAD:feat/timetable-conflict-visibility-and-roster-notes
