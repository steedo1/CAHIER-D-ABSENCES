name: Finalize file correspondent access

on:
  push:
    branches:
      - work/correspondant-fichier-finalize-20260830
    paths:
      - .github/workflows/finalize-file-correspondent.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/correspondant-fichier-finalize-20260830
          fetch-depth: 0

      - name: Patch correspondent permissions
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"{path}: pattern not found: {old!r}")
              p.write_text(text.replace(old, new), encoding="utf-8")

          # Navigation dédiée : l'Admin conserve Utilisateurs & rôles et le Relais.
          # Le Correspondant fichier garde uniquement les fonctions métier nécessaires.
          replace(
              "src/app/admin/ui/file-correspondent-shell.tsx",
              "  Users,\n",
              "",
          )
          replace(
              "src/app/admin/ui/file-correspondent-shell.tsx",
              '      { href: "/admin/users", label: "Utilisateurs & rôles", Icon: Users },\n',
              "",
          )
          replace(
              "src/app/admin/ui/file-correspondent-shell.tsx",
              '      { href: "/admin/relais", label: "Mon Cahier Relais", Icon: Settings, allowSubpaths: true },\n',
              "",
          )

          # Rapport F : lecture/écriture limitée à l'établissement du rôle.
          replace(
              "src/app/api/admin/rapport-f/settings/route.ts",
              '["admin", "super_admin"]',
              '["admin", "super_admin", "file_correspondent"]',
          )

          # Coefficients : le Correspondant fichier peut exploiter les paramètres pédagogiques.
          replace(
              "src/app/api/admin/institution/subject-coeffs/route.ts",
              '  "finance_manager",\n] as const;',
              '  "finance_manager",\n  "file_correspondent",\n] as const;',
          )
          replace(
              "src/app/api/admin/institution/subject-coeffs/route.ts",
              'const SUBJECT_COEFF_WRITE_ROLES = ["admin", "super_admin"] as const;',
              'const SUBJECT_COEFF_WRITE_ROLES = ["admin", "super_admin", "file_correspondent"] as const;',
          )

          # Sous-matières : même périmètre établissement, sans élargir les comptes utilisateurs.
          replace(
              "src/app/api/admin/institution/subject-components/route.ts",
              '["admin", "super_admin"]',
              '["admin", "super_admin", "file_correspondent"]',
          )

          # Organisation pédagogique : lecture/écriture du paramétrage scolaire.
          replace(
              "src/app/api/admin/institution/education-organization/route.ts",
              'const WRITABLE_ROLES = new Set(["admin", "super_admin"]);',
              'const WRITABLE_ROLES = new Set(["admin", "super_admin", "file_correspondent"]);',
          )
          replace(
              "src/app/api/admin/institution/education-organization/route.ts",
              '  "finance_manager",\n]);',
              '  "finance_manager",\n  "file_correspondent",\n]);',
          )

          # Horaires établissement.
          replace(
              "src/app/api/admin/institution/periods/route.ts",
              '["admin", "super_admin"]',
              '["admin", "super_admin", "file_correspondent"]',
          )

      - name: Commit final permissions and remove helper workflow
        run: |
          rm .github/workflows/finalize-file-correspondent.yml
          git config user.name "steedo1"
          git config user.email "ariskouadio22@gmail.com"
          git add -A
          git commit -m "feat(correspondent): finalize scoped school permissions"
          git push origin HEAD:work/correspondant-fichier-finalize-20260830
