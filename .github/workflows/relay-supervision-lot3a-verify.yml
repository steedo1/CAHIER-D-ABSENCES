name: Relay Supervision LOT3A Verify

on:
  push:
    branches:
      - agent/relay-supervision-lot3a-20260817
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Typecheck Web
        run: npx tsc --noEmit

      - name: Test relay supervision UI invariants
        run: node --test test/relay-supervision-ui.test.mjs
