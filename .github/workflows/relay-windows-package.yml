name: Relay Windows Package

on:
  push:
    branches:
      - work/relay-windows-release-20260822
      - reprise-propre-5418ce7-20260729
    paths:
      - "desktop/relay/**"
      - ".github/workflows/relay-windows-package.yml"
  pull_request:
    branches:
      - reprise-propre-5418ce7-20260729
    paths:
      - "desktop/relay/**"
      - ".github/workflows/relay-windows-package.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: desktop/relay/package-lock.json

      - name: Install relay dependencies
        working-directory: desktop/relay
        shell: pwsh
        run: npm ci --no-audit --no-fund

      - name: Verify relay
        working-directory: desktop/relay
        shell: pwsh
        run: npm run verify

      - name: Stage portable relay
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Stage = Join-Path $PWD "desktop\relay\stage\App"
          New-Item -ItemType Directory -Force -Path $Stage | Out-Null

          foreach ($Directory in @("dist", "src", "scripts", "migrations", "windows", "node_modules")) {
            Copy-Item -LiteralPath (Join-Path $PWD "desktop\relay\$Directory") -Destination $Stage -Recurse -Force
          }
          foreach ($File in @("package.json", "package-lock.json", "tsconfig.json")) {
            Copy-Item -LiteralPath (Join-Path $PWD "desktop\relay\$File") -Destination $Stage -Force
          }

          # Windows PowerShell 5.1 traite les scripts UTF-8 sans BOM comme de l'ANSI.
          # Avec des caractères français (notamment le tiret cadratin), cela peut casser
          # le parseur avant même l'exécution. Tous les .ps1 du paquet sont donc réécrits
          # explicitement en UTF-8 avec BOM avant compilation du Setup.
          $Utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          $Utf8Bom = New-Object System.Text.UTF8Encoding($true)
          Get-ChildItem -LiteralPath (Join-Path $Stage "windows") -Filter "*.ps1" -File -Recurse |
            ForEach-Object {
              $Text = [System.IO.File]::ReadAllText($_.FullName, $Utf8NoBom)
              [System.IO.File]::WriteAllText($_.FullName, $Text, $Utf8Bom)
            }

          $Runtime = Join-Path $Stage "runtime"
          New-Item -ItemType Directory -Force -Path $Runtime | Out-Null
          $NodeRoot = Split-Path (Get-Command node.exe).Source -Parent
          Copy-Item -LiteralPath (Join-Path $NodeRoot "node.exe") -Destination $Runtime -Force
          Copy-Item -LiteralPath (Join-Path $NodeRoot "npm.cmd") -Destination $Runtime -Force
          Copy-Item -LiteralPath (Join-Path $NodeRoot "npm") -Destination $Runtime -Force -ErrorAction SilentlyContinue
          Copy-Item -LiteralPath (Join-Path $NodeRoot "npm.ps1") -Destination $Runtime -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path (Join-Path $Runtime "node_modules") | Out-Null
          Copy-Item -LiteralPath (Join-Path $NodeRoot "node_modules\npm") -Destination (Join-Path $Runtime "node_modules") -Recurse -Force

          $Package = Get-Content "desktop\relay\package.json" -Raw | ConvertFrom-Json
          $Manifest = [ordered]@{
            product = "Mon Cahier Relay"
            release = "Rentree-2026-2027"
            installer_version = "2026.08.23.1"
            relay_version = [string]$Package.version
            schema_version = 9
            git_commit = "${{ github.sha }}"
            git_branch = "${{ github.ref_name }}"
            node_version = (& (Join-Path $Runtime "node.exe") --version).Trim()
            built_at_utc = [DateTime]::UtcNow.ToString("o")
          }
          $Manifest | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $Stage "release-manifest.json") -Encoding UTF8

      - name: Smoke-test portable runtime
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $App = Join-Path $PWD "desktop\relay\stage\App"
          Push-Location $App
          try {
            & ".\runtime\node.exe" -e "require('./node_modules/better-sqlite3'); console.log('PORTABLE_RUNTIME_OK')"
            if ($LASTEXITCODE -ne 0) { throw "Portable runtime smoke test failed." }

            $Config = Join-Path $App "package-smoke-config.json"
            & ".\runtime\node.exe" ".\dist\src\cli.mjs" configure --config $Config --institution-code "PKG-TEST" --institution-name "Package Smoke Test" | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Portable configure smoke test failed." }
            & ".\runtime\node.exe" ".\dist\src\cli.mjs" doctor --config $Config | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Portable doctor smoke test failed." }

            $WindowsPowerShell = Join-Path $env:WINDIR "System32\WindowsPowerShell\v1.0\powershell.exe"
            if (-not (Test-Path -LiteralPath $WindowsPowerShell)) {
              throw "Windows PowerShell 5.1 introuvable sur le runner."
            }

            $ParserHelper = Join-Path $env:TEMP "moncahier-parse-packaged-script.ps1"
            $ParserHelperCode = @'
param([Parameter(Mandatory = $true)][string]$Path)
$Tokens = $null
$Errors = $null
[System.Management.Automation.Language.Parser]::ParseFile($Path, [ref]$Tokens, [ref]$Errors) | Out-Null
if ($Errors.Count -gt 0) {
    foreach ($ParseError in $Errors) {
        [Console]::Error.WriteLine($ParseError.Message)
    }
    exit 1
}
exit 0
'@
            [System.IO.File]::WriteAllText($ParserHelper, $ParserHelperCode, [System.Text.Encoding]::ASCII)

            foreach ($Script in Get-ChildItem -LiteralPath (Join-Path $App "windows") -Filter "*.ps1" -File -Recurse) {
              $Bytes = [System.IO.File]::ReadAllBytes($Script.FullName)
              if (
                $Bytes.Length -lt 3 -or
                $Bytes[0] -ne 0xEF -or
                $Bytes[1] -ne 0xBB -or
                $Bytes[2] -ne 0xBF
              ) {
                throw "Script sans BOM UTF-8 : $($Script.FullName)"
              }

              & $WindowsPowerShell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File $ParserHelper -Path $Script.FullName
              if ($LASTEXITCODE -ne 0) {
                throw "Windows PowerShell 5.1 ne peut pas parser : $($Script.FullName)"
              }
            }
            Write-Host "WINDOWS_POWERSHELL_5_1_PARSE_OK"
          } finally {
            Pop-Location
          }

      - name: Install Inno Setup
        shell: pwsh
        run: |
          $Iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path -LiteralPath $Iscc)) {
            choco install innosetup --no-progress -y
          }
          if (-not (Test-Path -LiteralPath $Iscc)) {
            throw "Inno Setup 6 introuvable."
          }

      - name: Build Setup.exe
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          $Iss = Join-Path $PWD "desktop\relay\windows\MonCahier-Relay-Setup.iss"
          $Stage = Join-Path $PWD "desktop\relay\stage"
          $Release = Join-Path $PWD "desktop\relay\release"
          New-Item -ItemType Directory -Force -Path $Release | Out-Null
          & $Iscc "/DMyAppVersion=2026.08.23.1" "/DSourceDir=$Stage" "/DOutputDir=$Release" $Iss
          if ($LASTEXITCODE -ne 0) { throw "Compilation Inno Setup échouée." }

      - name: Create checksum and release notes
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $Release = Join-Path $PWD "desktop\relay\release"
          $Exe = Join-Path $Release "MonCahier-Relay-Setup-Rentree-2026-2027.exe"
          if (-not (Test-Path -LiteralPath $Exe)) { throw "Setup.exe introuvable." }
          $Hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $Exe).Hash.ToLowerInvariant()
          "$Hash  MonCahier-Relay-Setup-Rentree-2026-2027.exe" |
            Set-Content -LiteralPath (Join-Path $Release "MonCahier-Relay-Setup-Rentree-2026-2027.sha256.txt") -Encoding ASCII
          @"
          MON CAHIER RELAY - RENTREE 2026-2027
          ====================================
          Build Git : ${{ github.sha }}
          Branche   : ${{ github.ref_name }}
          Schema DB : 9
          Setup     : 2026.08.23.1

          Installation :
          1. Copier le Setup.exe sur le PC relais Windows 10/11 x64.
          2. Double-cliquer sur le Setup.exe et accepter l'élévation Administrateur.
          3. Saisir le code puis le nom de l'établissement.
          4. Dans Mon Cahier, coller le jeton Admin puis Tester et synchroniser.
          5. Redémarrer le PC une fois et vérifier que la tâche 'Mon Cahier Relay' est Running.

          Le runtime Node est inclus. Aucun Node.js ni dépôt Git n'est requis sur le PC de l'établissement.
          Les scripts PowerShell embarqués sont validés avec Windows PowerShell 5.1 avant publication.
          "@ | Set-Content -LiteralPath (Join-Path $Release "LISEZ-MOI.txt") -Encoding UTF8

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: MonCahier-Relay-Setup-Rentree-2026-2027
          path: |
            desktop/relay/release/MonCahier-Relay-Setup-Rentree-2026-2027.exe
            desktop/relay/release/MonCahier-Relay-Setup-Rentree-2026-2027.sha256.txt
            desktop/relay/release/LISEZ-MOI.txt
          if-no-files-found: error
          retention-days: 30
