name: Temporary file correspondent roster rights fix

on:
  push:
    branches:
      - reprise-propre-5418ce7-20260729

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reprise-propre-5418ce7-20260729
          fetch-depth: 0

      - name: Patch roster permissions
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/api/admin/classes/[id]/roster/route.ts')
          text = path.read_text(encoding='utf-8')

          old_write = 'new Set(["admin", "super_admin", "founder", "finance_manager", "finance"])'
          new_write = 'new Set(["admin", "super_admin", "founder", "file_correspondent", "finance_manager", "finance"])'

          old_read = '''    : new Set([\n        "admin",\n        "super_admin",\n        "founder",\n        "finance_manager",\n        "finance",\n      ]);'''
          new_read = '''    : new Set([\n        "admin",\n        "super_admin",\n        "founder",\n        "file_correspondent",\n        "finance_manager",\n        "finance",\n      ]);'''

          old_can_write = '''  const writeRoles = new Set([\n    "admin",\n    "super_admin",\n    "founder",\n    "finance_manager",\n    "finance",\n  ]);'''
          new_can_write = '''  const writeRoles = new Set([\n    "admin",\n    "super_admin",\n    "founder",\n    "file_correspondent",\n    "finance_manager",\n    "finance",\n  ]);'''

          changed = False
          for old, new in ((old_write, new_write), (old_read, new_read), (old_can_write, new_can_write)):
              if new in text:
                  continue
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one permission block, found {count}: {old[:80]!r}')
              text = text.replace(old, new, 1)
              changed = True

          if changed:
              path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- 'src/app/api/admin/classes/[id]/roster/route.ts'

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'steedo1'
          git config user.email 'ariskouadio22@gmail.com'
          git add 'src/app/api/admin/classes/[id]/roster/route.ts'
          git commit -m 'fix(auth): restore file correspondent roster rights'
          git push origin HEAD:reprise-propre-5418ce7-20260729
