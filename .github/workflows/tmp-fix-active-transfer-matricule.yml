name: Temporary active transfer matricule fix

on:
  push:
    branches:
      - reprise-propre-5418ce7-20260729

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: reprise-propre-5418ce7-20260729
          fetch-depth: 0

      - name: Patch transfer resolution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/app/api/admin/enrollments/assign/route.ts')
          text = path.read_text(encoding='utf-8')
          changed = False

          old = '''      const { data: exist, error: exErr } = await srv
        .from("students")
        .select("id,first_name,last_name,matricule")
        .eq("institution_id", inst)
        .eq("matricule", matricule)
        .maybeSingle();
      if (exErr)
        return NextResponse.json({ error: exErr.message }, { status: 400 });
      if (!exist)
        return NextResponse.json(
          { error: "student_not_found" },
          { status: 404 },
        );

      studentId = (exist as any).id;
      studentFirst = (exist as any).first_name ?? null;
      studentLast = (exist as any).last_name ?? null;
      studentMatricule = (exist as any).matricule ?? null;'''

          new = '''      const { data: exist, error: exErr } = await srv
        .from("students")
        .select("id,first_name,last_name,matricule,lifecycle_status")
        .eq("institution_id", inst)
        .eq("matricule", matricule)
        .maybeSingle();
      if (exErr)
        return NextResponse.json({ error: exErr.message }, { status: 400 });
      if (!exist)
        return NextResponse.json(
          { error: "student_not_found" },
          { status: 404 },
        );

      // Certains anciens retraits CSCA ont laissé le matricule sur une fiche
      // historique `exited` alors qu'une nouvelle fiche active de la même
      // identité existe. Le matricule doit alors conduire à la fiche active,
      // jamais ressusciter l'ancienne fiche retirée.
      if ((exist as any).lifecycle_status === "exited") {
        const activeCandidates = (
          await findStudentIdentityCandidates(srv as any, inst, [
            `${String((exist as any).last_name || "").trim()} ${String((exist as any).first_name || "").trim()}`,
          ])
        ).filter((candidate) => String(candidate.id) !== String((exist as any).id));

        if (activeCandidates.length !== 1) {
          return NextResponse.json(
            {
              error:
                "Ce matricule appartient à une ancienne fiche retirée et aucune fiche active unique ne peut être déterminée. Recherchez l’élève par nom et prénom.",
              code: "retired_matricule_ambiguous",
            },
            { status: 409 },
          );
        }

        const active = activeCandidates[0];
        studentId = active.id;
        studentFirst = active.first_name ?? null;
        studentLast = active.last_name ?? null;
        studentMatricule = active.matricule ?? (exist as any).matricule ?? null;
      } else {
        studentId = (exist as any).id;
        studentFirst = (exist as any).first_name ?? null;
        studentLast = (exist as any).last_name ?? null;
        studentMatricule = (exist as any).matricule ?? null;
      }'''

          if new not in text:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'matricule block expected once, found {count}')
              text = text.replace(old, new, 1)
              changed = True

          old_guard = '''  if (studentLifecycleBefore.lifecycle_status === "duplicate_merged") {
    await rollbackPreparedStudent();
    return NextResponse.json({ error: "Cette ancienne fiche a déjà été fusionnée. Recherchez la fiche actuelle de l’élève.", code: "student_already_merged" }, { status: 409 });
  }

  const rollbackLifecycle = async () => {'''

          new_guard = '''  if (studentLifecycleBefore.lifecycle_status === "duplicate_merged") {
    await rollbackPreparedStudent();
    return NextResponse.json({ error: "Cette ancienne fiche a déjà été fusionnée. Recherchez la fiche actuelle de l’élève.", code: "student_already_merged" }, { status: 409 });
  }

  if (studentLifecycleBefore.lifecycle_status === "exited") {
    await rollbackPreparedStudent();
    return NextResponse.json(
      {
        error:
          "Cette fiche élève a été retirée. Sélectionnez la fiche active actuelle de l’élève.",
        code: "student_already_exited",
      },
      { status: 409 },
    );
  }

  const rollbackLifecycle = async () => {'''

          if new_guard not in text:
              count = text.count(old_guard)
              if count != 1:
                  raise SystemExit(f'lifecycle guard expected once, found {count}')
              text = text.replace(old_guard, new_guard, 1)
              changed = True

          if changed:
              path.write_text(text, encoding='utf-8')
          PY

          git diff --check
          git diff -- 'src/app/api/admin/enrollments/assign/route.ts'

      - name: Commit fix
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No change required.'
            exit 0
          fi
          git config user.name 'steedo1'
          git config user.email 'ariskouadio22@gmail.com'
          git add 'src/app/api/admin/enrollments/assign/route.ts'
          git commit -m 'fix(students): resolve retired matricules to active student'
          git push origin HEAD:reprise-propre-5418ce7-20260729
