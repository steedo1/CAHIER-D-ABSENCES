name: One-shot statistics navigation patch

on:
  push:
    branches:
      - work/statistiques-generales-20260830

permissions:
  contents: write

jobs:
  patch-navigation:
    if: ${{ !contains(github.event.head_commit.message, '[stats-nav-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/statistiques-generales-20260830
          fetch-depth: 0

      - name: Patch navigation
        shell: python
        run: |
          from pathlib import Path
          import re

          route = '/admin/finance/statistiques-generales'
          sidebar = Path('src/app/admin/ui/sidebar-nav.tsx')
          text = sidebar.read_text(encoding='utf-8')

          stats_item = (
              '  {\n'
              '    href: "/admin/finance/statistiques-generales",\n'
              '    label: "Statistiques générales",\n'
              '    Icon: BarChart3,\n'
              '  },\n'
          )

          if route not in text:
              pattern = re.compile(
                  r'(const FILE_CORRESPONDENCE_ITEMS: NavItem\[\] = \[\s*'
                  r'\{\s*href: "/admin/export-moyennes",\s*'
                  r'label: "Export DESPS",\s*Icon: FileSpreadsheet,\s*\},)'
              )
              text, count = pattern.subn(lambda m: m.group(1) + '\n' + stats_item.rstrip('\n'), text, count=1)
              if count != 1:
                  raise SystemExit('Main correspondent navigation anchor not found')

          if text.count(route) < 2:
              pattern = re.compile(
                  r'(const FINANCE_FULL_ITEMS: NavItem\[\] = \[\s*'
                  r'\{ href: "/admin/finance", label: "Tableau financier", Icon: LayoutDashboard \},)'
              )
              text, count = pattern.subn(lambda m: m.group(1) + '\n' + stats_item.rstrip('\n'), text, count=1)
              if count != 1:
                  raise SystemExit('Finance navigation anchor not found')

          if text.count(route) != 2:
              raise SystemExit(f'Expected 2 statistics menu entries, found {text.count(route)}')

          sidebar.write_text(text, encoding='utf-8')

      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/one-shot-stats-nav-20260830.yml
          git config user.name "Mon Cahier Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/admin/ui/sidebar-nav.tsx .github/workflows/one-shot-stats-nav-20260830.yml
          git diff --cached --check
          git commit -m "feat(stats): expose general statistics in finance menu [stats-nav-done]"
          git push origin HEAD:work/statistiques-generales-20260830
