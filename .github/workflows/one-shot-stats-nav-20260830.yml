name: One-shot statistics navigation patch

on:
  push:
    branches:
      - work/statistiques-generales-20260830

permissions:
  contents: write

jobs:
  patch-navigation:
    if: ${{ !contains(github.event.head_commit.message, '[stats-nav-done]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/statistiques-generales-20260830
          fetch-depth: 0

      - name: Patch navigation
        shell: python
        run: |
          from pathlib import Path

          route = '/admin/finance/statistiques-generales'

          correspondent = Path('src/app/admin/ui/file-correspondent-shell.tsx')
          text = correspondent.read_text(encoding='utf-8')
          if route not in text:
              needle = '      { href: "/admin/export-moyennes", label: "Export DESPS", Icon: FileSpreadsheet },\n'
              insert = needle + '      { href: "/admin/finance/statistiques-generales", label: "Statistiques générales", Icon: FileSpreadsheet, allowSubpaths: true },\n'
              if needle not in text:
                  raise SystemExit('Correspondant navigation anchor not found')
              text = text.replace(needle, insert, 1)
              correspondent.write_text(text, encoding='utf-8')

          sidebar = Path('src/app/admin/ui/sidebar-nav.tsx')
          text = sidebar.read_text(encoding='utf-8')
          stats_item = '''  {
            href: "/admin/finance/statistiques-generales",
            label: "Statistiques générales",
            Icon: BarChart3,
          },
          '''

          if route not in text:
              file_anchor = '''  {
            href: "/admin/export-moyennes",
            label: "Export DESPS",
            Icon: FileSpreadsheet,
          },
          '''
              if file_anchor not in text:
                  raise SystemExit('Main correspondent navigation anchor not found')
              text = text.replace(file_anchor, file_anchor + stats_item, 1)

              finance_anchor = '  { href: "/admin/finance", label: "Tableau financier", Icon: LayoutDashboard },\n'
              if finance_anchor not in text:
                  raise SystemExit('Finance navigation anchor not found')
              text = text.replace(finance_anchor, finance_anchor + stats_item, 1)
              sidebar.write_text(text, encoding='utf-8')
          else:
              if text.count(route) < 2:
                  finance_anchor = '  { href: "/admin/finance", label: "Tableau financier", Icon: LayoutDashboard },\n'
                  if finance_anchor not in text:
                      raise SystemExit('Finance navigation anchor not found')
                  text = text.replace(finance_anchor, finance_anchor + stats_item, 1)
                  sidebar.write_text(text, encoding='utf-8')

      - name: Remove one-shot workflow and commit
        run: |
          rm -f .github/workflows/one-shot-stats-nav-20260830.yml
          git config user.name "Mon Cahier Automation"
          git config user.email "actions@users.noreply.github.com"
          git add src/app/admin/ui/file-correspondent-shell.tsx src/app/admin/ui/sidebar-nav.tsx .github/workflows/one-shot-stats-nav-20260830.yml
          git diff --cached --check
          git commit -m "feat(stats): expose general statistics in correspondent and finance menus [stats-nav-done]"
          git push origin HEAD:work/statistiques-generales-20260830
