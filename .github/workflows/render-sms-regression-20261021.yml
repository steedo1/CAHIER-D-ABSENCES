name: Render SMS dispatch regression

on:
  push:
    branches:
      - fix/render-sms-jsonb-filter-20261021
  pull_request:
    branches:
      - migration-render-test-20261021
    paths:
      - src/app/api/sms/dispatch/route.ts
      - test/sms-dispatch-jsonb.test.mjs
      - .github/workflows/render-sms-regression-20261021.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: node --test test/sms-dispatch-jsonb.test.mjs test/parent-connect-sms.test.mjs test/render-cron-secret-auth.test.mjs
      - run: npm run typecheck
