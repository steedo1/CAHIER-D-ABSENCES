name: Render exceptional course regression gate

on:
  pull_request:
    branches: [migration-render-test-20261021]
    paths:
      - 'src/app/class/page.tsx'
      - 'src/app/api/class/subjects/route.ts'
      - 'src/app/api/class/sessions/**'
      - 'src/app/api/teacher/sessions/open/route.ts'
      - 'src/components/BackgroundAttendanceDeliverySync.tsx'
      - 'public/moncahier-sw.js'
      - 'src/lib/attendance-auto-close.ts'
      - 'src/lib/offline.ts'
      - 'src/lib/offlineClassDevice.ts'
      - 'src/lib/offline-release.ts'
      - 'src/lib/teacher-attendance-cloud-sync.ts'
      - 'src/lib/offline-readiness.ts'
      - 'supabase/migrations/*class_exceptional_session_guard.sql'
      - 'scripts/test-cloud-pwa.mjs'
      - 'scripts/verify-class-exceptional-concurrency.mjs'
      - 'scripts/verify-cloud-pwa-browser.mjs'
      - 'test/attendance-*.test.*'
      - 'test/class-*.test.*'
      - 'test/offline-*.test.*'
      - 'test/class-device-other-course-ui.test.mjs'
      - 'test/class-device-multi-course-start.test.mjs'
      - '.github/workflows/render-other-course-gate.yml'

permissions:
  contents: read

concurrency:
  group: render-other-course-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: audit
          POSTGRES_PASSWORD: isolated-audit
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U audit"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_OPTIONS: --max-old-space-size=4096
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: https://example.invalid
      NEXT_PUBLIC_SUPABASE_ANON_KEY: isolated-ci-anon
      SUPABASE_URL: https://example.invalid
      SUPABASE_SERVICE_ROLE_KEY: isolated-ci-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript check
        run: npm run typecheck
      - name: Exceptional course and class-device regressions
        run: npm run test:cloud-pwa
      - name: Real PostgreSQL concurrent session opening
        env:
          MON_CAHIER_AUDIT_PG_PORT: '5432'
          PGPASSWORD: isolated-audit
        run: node scripts/verify-class-exceptional-concurrency.mjs
      - name: Install isolated browser
        run: npx playwright install --with-deps chromium
      - name: Real service worker and IndexedDB offline restart
        run: node scripts/verify-cloud-pwa-browser.mjs
      - name: Next.js optimized build
        run: npm run build
