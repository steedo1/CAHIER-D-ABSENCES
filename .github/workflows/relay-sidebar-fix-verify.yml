name: Relay Sidebar Fix Verify

on:
  push:
    branches:
      - fix/relay-sidebar-entry-20260817

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test relay supervision UI invariants
        run: node --test test/relay-supervision-ui.test.mjs
