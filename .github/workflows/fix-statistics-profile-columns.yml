name: Fix statistics profile columns

on:
  push:
    branches:
      - fix/statistics-profile-columns-20260825

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/statistics-profile-columns-20260825
          fetch-depth: 0
      - name: Apply targeted patch
        run: node scripts/fix-statistics-profile-columns.cjs
      - name: Remove one-shot helpers
        run: |
          rm -f scripts/fix-statistics-profile-columns.cjs
          rm -f .github/workflows/fix-statistics-profile-columns.yml
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(statistics): aligner profiles sur le schema reel"
          git push origin HEAD:fix/statistics-profile-columns-20260825
