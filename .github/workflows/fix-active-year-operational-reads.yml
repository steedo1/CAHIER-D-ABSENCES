name: Apply active-year operational guard

on:
  push:
    branches:
      - fix/edt-active-year-preview-20260905
    paths:
      - .github/workflows/fix-active-year-operational-reads.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/edt-active-year-preview-20260905
          fetch-depth: 0

      - name: Apply active-year guard
        run: python .github/scripts/fix_active_year_operational.py

      - name: Commit active-year guard
        run: |
          rm .github/workflows/fix-active-year-operational-reads.yml
          rm .github/scripts/fix_active_year_operational.py
          git config user.name "steedo1"
          git config user.email "ariskouadio22@gmail.com"
          git add -A
          git commit -m "fix(attendance): ignore non-current academic years operationally"
          git push origin HEAD:fix/edt-active-year-preview-20260905
