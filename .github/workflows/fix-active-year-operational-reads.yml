name: Harden active academic year attendance

on:
  push:
    branches:
      - fix/edt-active-year-preview-20260905
    paths:
      - .github/workflows/fix-active-year-operational-reads.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/edt-active-year-preview-20260905
          fetch-depth: 0

      - name: Restrict operational attendance to current academic year
        shell: python
        run: |
          from pathlib import Path
          import re

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8")

          def sub_once(path, pattern, repl, flags=0):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              text2, count = re.subn(pattern, repl, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f"{path}: regex expected once, found {count}: {pattern[:120]}")
              write(path, text2)

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected once, found {count}: {old[:120]!r}")
              write(path, text.replace(old, new, 1))

          # Téléphone classe : identité, téléphone et login ne résolvent que l'année active.
          path = "src/lib/class-device-identity.ts"
          sub_once(
              path,
              r'(function uniq\(values: unknown\[\]\) \{.*?\n\})\n\nexport function legacyClassPhoneCandidates',
              r'''\1

async function currentAcademicYearsByInstitution(
  service: ServiceClient,
  institutionIds: string[],
) {
  const ids = uniq(institutionIds);
  const byInstitution = new Map<string, string>();
  if (!ids.length) return byInstitution;

  const { data, error } = await service
    .from("academic_years")
    .select("institution_id,code")
    .in("institution_id", ids)
    .eq("is_current", true);
  if (error) throw new Error("current_academic_year_lookup_failed");

  for (const row of data || []) {
    const institutionId = String(row?.institution_id || "").trim();
    const code = String(row?.code || "").trim();
    if (institutionId && code) byInstitution.set(institutionId, code);
  }
  return byInstitution;
}

function classBelongsToCurrentAcademicYear(
  row: any,
  currentYears: Map<string, string>,
) {
  const institutionId = String(row?.institution_id || "").trim();
  const academicYear = String(row?.academic_year || "").trim();
  return Boolean(
    institutionId &&
      academicYear &&
      currentYears.get(institutionId) === academicYear,
  );
}

export function legacyClassPhoneCandidates''',
              flags=re.S,
          )
          replace_once(
              path,
              '  if (!institutionIds.length) return [];\n\n  const ids = new Set<string>();',
              '  if (!institutionIds.length) return [];\n\n  const currentYears = await currentAcademicYearsByInstitution(\n    input.service,\n    institutionIds,\n  );\n  if (!currentYears.size) return [];\n\n  const ids = new Set<string>();',
          )
          text = Path(path).read_text(encoding="utf-8")
          if text.count('.select("id,institution_id")') != 2:
              raise SystemExit("class-device-identity.ts: unexpected class select count")
          text = text.replace('.select("id,institution_id")', '.select("id,institution_id,academic_year")')
          write(path, text)
          replace_once(
              path,
              '  for (const row of linked || []) {\n    if (row?.id) ids.add(String(row.id));\n  }',
              '  for (const row of linked || []) {\n    if (row?.id && classBelongsToCurrentAcademicYear(row, currentYears)) {\n      ids.add(String(row.id));\n    }\n  }',
          )
          replace_once(
              path,
              '    for (const row of legacy || []) {\n      if (row?.id) ids.add(String(row.id));\n    }',
              '    for (const row of legacy || []) {\n      if (row?.id && classBelongsToCurrentAcademicYear(row, currentYears)) {\n        ids.add(String(row.id));\n      }\n    }',
          )
          replace_once(
              path,
              '.select("id,institution_id,class_device_auth_user_id")\n    .eq("class_login_identifier_key", key)\n    .limit(2);',
              '.select("id,institution_id,academic_year,class_device_auth_user_id")\n    .eq("class_login_identifier_key", key)\n    .limit(20);',
          )
          replace_once(
              path,
              '  const { data: rows, error } = await query;\n  if (error) throw new Error("class_identifier_lookup_failed");\n  if (!Array.isArray(rows) || rows.length === 0) return { status: "not_found" };\n  if (rows.length !== 1) return { status: "ambiguous" };\n\n  const row = rows[0];',
              '  const { data: rows, error } = await query;\n  if (error) throw new Error("class_identifier_lookup_failed");\n\n  const candidates = Array.isArray(rows) ? rows : [];\n  const candidateInstitutionIds = uniq(\n    candidates.map((row: any) => row?.institution_id),\n  );\n  const currentYears = await currentAcademicYearsByInstitution(\n    input.service,\n    candidateInstitutionIds,\n  );\n  const activeRows = candidates.filter((row: any) =>\n    classBelongsToCurrentAcademicYear(row, currentYears),\n  );\n\n  if (activeRows.length === 0) return { status: "not_found" };\n  if (activeRows.length !== 1) return { status: "ambiguous" };\n\n  const row = activeRows[0];',
          )

          # Téléphone professeur en ligne : les vieux teacher_timetables ne deviennent jamais un cours courant.
          path = "src/app/api/teacher/classes/route.ts"
          replace_once(
              path,
              '    const { data: institution, error: institutionError } = await srv\n',
              '''    const { data: currentYearRow, error: currentYearError } = await srv
      .from("academic_years")
      .select("code")
      .eq("institution_id", institutionId)
      .eq("is_current", true)
      .limit(1)
      .maybeSingle();
    if (currentYearError) {
      return noStoreJson({ error: currentYearError.message }, 400);
    }
    const activeAcademicYear = String(currentYearRow?.code || "").trim();
    if (!activeAcademicYear) {
      return noStoreJson({ items: [], source: "teacher_timetables" });
    }

    const { data: institution, error: institutionError } = await srv
''',
          )
          replace_once(
              path,
              '      .eq("institution_id", institutionId)\n      .in("id", classIds);',
              '      .eq("institution_id", institutionId)\n      .eq("academic_year", activeAcademicYear)\n      .in("id", classIds);',
          )
          replace_once(
              path,
              '    const classById = new Map(\n      ((classes || []) as any[]).map((row) => [String(row.id), row]),\n    );\n    const subjectLookup = await buildSubjectLookup(\n      srv,\n      timetables.map((row) => row.subject_id),\n    );\n\n    const items = timetables',
              '    const classById = new Map(\n      ((classes || []) as any[]).map((row) => [String(row.id), row]),\n    );\n    const activeTimetables = timetables.filter((row) =>\n      classById.has(String(row.class_id || "").trim()),\n    );\n    const subjectLookup = await buildSubjectLookup(\n      srv,\n      activeTimetables.map((row) => row.subject_id),\n    );\n\n    const items = activeTimetables',
          )

          # Bootstrap professeur hors ligne : snapshot = année active uniquement.
          path = "src/app/api/teacher/offline/bootstrap/route.ts"
          replace_once(
              path,
              '    const revisionBefore = await scheduleRevision(srv, institutionId);\n',
              '''    const { data: currentYearRow, error: currentYearError } = await srv
      .from("academic_years")
      .select("code")
      .eq("institution_id", institutionId)
      .eq("is_current", true)
      .limit(1)
      .maybeSingle();
    if (currentYearError) {
      return noStoreJson({ error: currentYearError.message }, 400);
    }
    const activeAcademicYear = String(currentYearRow?.code || "").trim();
    if (!activeAcademicYear) {
      return noStoreJson({ error: "active_academic_year_not_found" }, 409);
    }

    const revisionBefore = await scheduleRevision(srv, institutionId);
''',
          )
          replace_once(
              path,
              '        .select("id,institution_id,label,level")\n        .eq("institution_id", institutionId),',
              '        .select("id,institution_id,label,level")\n        .eq("institution_id", institutionId)\n        .eq("academic_year", activeAcademicYear),',
          )
          replace_once(
              path,
              '    const periods = ((periodResult.data || []) as any[]).filter(Boolean) as PeriodRow[];\n    const timetables = ((timetableResult.data || []) as any[]).filter(\n      (row) => row?.class_id && row?.period_id,\n    ) as TimetableRow[];\n    const classes = ((classResult.data || []) as any[]).filter(Boolean) as ClassRow[];\n',
              '    const periods = ((periodResult.data || []) as any[]).filter(Boolean) as PeriodRow[];\n    const classes = ((classResult.data || []) as any[]).filter(Boolean) as ClassRow[];\n    const activeClassIds = new Set(\n      classes.map((row) => String(row.id || "").trim()).filter(Boolean),\n    );\n    const timetables = ((timetableResult.data || []) as any[]).filter(\n      (row) =>\n        row?.class_id &&\n        row?.period_id &&\n        activeClassIds.has(String(row.class_id || "").trim()),\n    ) as TimetableRow[];\n    const assignments = ((assignmentResult.data || []) as any[]).filter(\n      (row) => activeClassIds.has(String(row?.class_id || "").trim()),\n    );\n',
          )
          replace_once(path, '      assignments: assignmentResult.data || [],', '      assignments,')

          # Éditeur EDT : aucun fallback vers une ancienne année si is_current manque.
          path = "src/app/api/admin/timetables/manual/route.ts"
          sub_once(
              path,
              r'  let academicYear = currentYear\?\.code \? String\(currentYear\.code\) : "";\n  if \(!academicYear\) \{.*?\n  \}\n\n  if \(!academicYear\) \{',
              '  const academicYear = currentYear?.code ? String(currentYear.code) : "";\n\n  if (!academicYear) {',
              flags=re.S,
          )

          checks = {
              "src/lib/class-device-identity.ts": ["currentAcademicYearsByInstitution", "classBelongsToCurrentAcademicYear", "academic_year,class_device_auth_user_id"],
              "src/app/api/teacher/classes/route.ts": ['.eq("academic_year", activeAcademicYear)', "activeTimetables"],
              "src/app/api/teacher/offline/bootstrap/route.ts": ['.eq("academic_year", activeAcademicYear)', "activeClassIds", "assignments,"],
              "src/app/api/admin/timetables/manual/route.ts": ["const academicYear = currentYear?.code"],
          }
          for filename, needles in checks.items():
              text = Path(filename).read_text(encoding="utf-8")
              for needle in needles:
                  if needle not in text:
                      raise SystemExit(f"assertion failed: {filename}: {needle}")

      - name: Commit active-year operational guard
        run: |
          rm .github/workflows/fix-active-year-operational-reads.yml
          git config user.name "steedo1"
          git config user.email "ariskouadio22@gmail.com"
          git add -A
          git commit -m "fix(attendance): ignore non-current academic years operationally"
          git push origin HEAD:fix/edt-active-year-preview-20260905
