name: Dispatch SMS Cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      validate_only:
        description: "Vérifier la configuration sans requête réseau ni envoi"
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: cron-dispatch-sms
  cancel-in-progress: false

jobs:
  call-sms-dispatch:
    # Sur une branche de préparation, seule la validation sans réseau est permise.
    if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.validate_only)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      CRON_URL: ${{ secrets.PROD_SMS_URL }}
      CRON_EXPECTED_PATH: "/api/sms/dispatch"
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      CRON_VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only && '1' || '0' }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
      - name: Test isolated cron caller
        run: node --test test/production-cron-caller.test.mjs
      - name: Call the verified production endpoint once
        run: node scripts/call-production-cron.mjs
