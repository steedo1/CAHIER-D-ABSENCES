name: Promote validated statistics release

on:
  push:
    branches:
      - ops/promote-statistiques-generales-20260830

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - name: Verify deployment identity
        run: |
          test "${DEPLOYMENT}" = "cahier-d-absences-pro-jsx37bpvd-ange-aristide-kouadios-projects.vercel.app"
        env:
          DEPLOYMENT: cahier-d-absences-pro-jsx37bpvd-ange-aristide-kouadios-projects.vercel.app

      - name: Promote exact READY deployment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "VERCEL_TOKEN repository secret is not configured."
            exit 2
          fi
          npx --yes vercel@latest promote "cahier-d-absences-pro-jsx37bpvd-ange-aristide-kouadios-projects.vercel.app" \
            --yes \
            --scope "ange-aristide-kouadios-projects" \
            --token "$VERCEL_TOKEN"
