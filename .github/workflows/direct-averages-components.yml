name: Saisie directe des moyennes par sous-matière

on:
  push:
    branches: [fix/saisie-directe-sous-matieres-francais-20261027, fix/bulletin-appreciations-sous-matieres-20261027]
    paths:
      - 'src/lib/grades/direct-subject-averages.ts'
      - 'src/app/api/admin/grades/direct-averages/**'
      - 'src/components/admin/DirectSubjectAverages.tsx'
      - 'src/app/api/admin/grades/bulletin/**'
      - 'src/app/admin/notes/bulletins/page.tsx'
      - 'src/app/admin/bulletins/page.tsx'
      - 'src/lib/grades/french-component-points.ts'
      - 'src/lib/grades/bulletin-visible-totals.ts'
      - 'test/bulletin-active-routes*.test.mjs'
      - 'test/helpers/bulletin-page-fixture.mjs'
      - 'src/lib/grades/subject-appreciation.ts'
      - 'test/bulletin-subject-appreciations.test.ts'
      - 'test/direct-averages.test.mjs'
      - 'test/direct-averages-ui.test.mjs'
      - 'test/direct-subject-component-averages.test.ts'
      - '.github/workflows/direct-averages-components.yml'
  pull_request:
    branches: [migration-render-test-20261021]
    paths:
      - 'src/lib/grades/direct-subject-averages.ts'
      - 'src/app/api/admin/grades/direct-averages/**'
      - 'src/components/admin/DirectSubjectAverages.tsx'
      - 'src/app/api/admin/grades/bulletin/**'
      - 'src/app/admin/notes/bulletins/page.tsx'
      - 'src/app/admin/bulletins/page.tsx'
      - 'src/lib/grades/french-component-points.ts'
      - 'src/lib/grades/bulletin-visible-totals.ts'
      - 'test/bulletin-active-routes*.test.mjs'
      - 'test/helpers/bulletin-page-fixture.mjs'
      - 'src/lib/grades/subject-appreciation.ts'
      - 'test/bulletin-subject-appreciations.test.ts'
      - 'test/direct-averages.test.mjs'
      - 'test/direct-averages-ui.test.mjs'
      - 'test/direct-subject-component-averages.test.ts'
      - '.github/workflows/direct-averages-components.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      NEXT_TELEMETRY_DISABLED: '1'
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: isolated-build-anon
      SUPABASE_SERVICE_ROLE_KEY: isolated-build-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Vérification TypeScript
        run: npm run typecheck
      - name: Tests unitaires des sous-matières et barèmes
        run: node --import tsx --test test/direct-subject-component-averages.test.ts
      - name: Tests des routes, bulletins et valeurs directes
        run: node --test test/direct-averages.test.mjs
      - name: Test du formulaire de saisie
        run: node --test test/direct-averages-ui.test.mjs
      - name: Vérifier les appréciations des sous-matières
        run: node --import tsx --test test/bulletin-subject-appreciations.test.ts
      - name: Rendu des deux pages réellement accessibles
        run: node --import tsx --test test/bulletin-active-routes.test.mjs test/french-component-points.test.ts
      - run: npx playwright install --with-deps chromium
      - name: Aperçu bureau, mobile et PDF des deux pages
        run: node --import tsx --test test/bulletin-active-routes-browser.test.mjs
        env:
          BULLETIN_PRINT_OUTPUT: artifacts/bulletins
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bulletin-active-routes-preview
          path: artifacts/bulletins
          retention-days: 7
      - name: Compilation Next
        run: npm run build
