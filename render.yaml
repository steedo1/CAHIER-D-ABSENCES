# Migration candidate built from ac615564; do not apply this blueprint to production.
# This file documents a test service. The existing manually configured Render service
# must be updated separately; blueprint creation could create another service.
services:
  - type: web
    name: mon-cahier-test
    runtime: node
    plan: free
    autoDeployTrigger: off
    buildCommand: npm ci && npm run build
    startCommand: npm run start
    healthCheckPath: /login
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
