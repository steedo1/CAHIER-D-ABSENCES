# RAM candidate based on b2cad912; do not apply this blueprint automatically.
# mon-cahier-test now serves www.mon-cahier.com and is PRODUCTION.
# The service is configured manually. Only apply the proposed commands after
# explicit owner approval; creating a blueprint could create another service.
services:
  - type: web
    name: mon-cahier-test
    runtime: node
    plan: free
    autoDeployTrigger: off
    # Compilation needs a larger heap, scoped to the build command only.
    buildCommand: npm ci && NODE_OPTIONS=--max-old-space-size=4096 npm run build
    # Explicit runtime flag overrides any inherited NODE_OPTIONS=...4096.
    # This is a tested candidate, not a change to the active service.
    startCommand: node --max-old-space-size=288 node_modules/next/dist/bin/next start --hostname 0.0.0.0
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
