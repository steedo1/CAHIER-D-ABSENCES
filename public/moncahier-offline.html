<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0f172a" />
    <title>Mon Cahier — Hors connexion</title>
    <style>
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; font-family: system-ui, sans-serif; color: #0f172a; background: #f8fafc; }
      main { width: min(520px, 100%); padding: 28px; border: 1px solid #cbd5e1; border-radius: 20px; background: white; box-shadow: 0 12px 40px rgba(15, 23, 42, .08); }
      .badge { display: inline-block; padding: 5px 10px; border-radius: 999px; color: #92400e; background: #fef3c7; font-size: 13px; }
      h1 { margin: 16px 0 8px; font-size: 26px; }
      p { color: #475569; line-height: 1.55; }
      button { margin-top: 12px; border: 0; border-radius: 12px; padding: 11px 16px; color: white; background: #059669; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <span class="badge">Hors connexion</span>
      <h1>Mon Cahier reste disponible</h1>
      <p>Cette page précise n’a pas encore été préparée sur cet appareil. Revenez à une page déjà ouverte ou réessayez après le retour du réseau.</p>
      <button type="button" onclick="history.back()">Revenir en arrière</button>
    </main>
  </body>
</html>
